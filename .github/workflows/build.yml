name: Build Zefavi
on:
  push: { branches: [ main, master ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create project
        run: |
          mkdir -p src/main/java/com/zefavi/client src/main/resources

          cat > build.gradle <<'EOF'
          plugins { id 'fabric-loom' version '1.9-SNAPSHOT' }
          version = '1.0.0'
          group = 'com.zefavi.client'
          base { archivesName = 'zefavi-client' }
          repositories { maven { url 'https://maven.fabricmc.net/' }; mavenCentral() }
          dependencies {
              minecraft 'com.mojang:minecraft:1.21.1'
              mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
              modImplementation 'net.fabricmc:fabric-loader:0.16.5'
              modImplementation 'net.fabricmc.fabric-api:fabric-api:0.115.0+1.21.1'
          }
          processResources { filesMatching('fabric.mod.json') { expand 'version': version } }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          EOF

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { maven { url 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() } }
          rootProject.name = 'zefavi-client'
          EOF

          cat > src/main/resources/fabric.mod.json <<'EOF'
          {
            "schemaVersion": 1,
            "id": "zefavi",
            "version": "1.0.0",
            "name": "Zefavi Client",
            "environment": "client",
            "entrypoints": { "client": ["com.zefavi.client.ZefaviClient"] },
            "depends": { "fabricloader": ">=0.16.0", "fabric-api": "*", "minecraft": "~1.21.1", "java": ">=21" }
          }
          EOF

          cat > src/main/java/com/zefavi/client/ZefaviClient.java <<'EOF'
          package com.zefavi.client;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;

          import java.util.ArrayList;
          import java.util.List;

          public class ZefaviClient implements ClientModInitializer {
              public static final List<Module> modules = new ArrayList<>();
              public static MainGui gui;
              public static KeyBinding guiKey;

              @Override public void onInitializeClient() {
                  gui = new MainGui();
                  guiKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.zefavi.gui", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT, "Zefavi"));
                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (guiKey.wasPressed()) client.setScreen(gui);
                      if (client.player == null) return;
                      for (Module m : modules) if (m.enabled) m.onTick(client);
                  });
              }

              public static abstract class Module {
                  public final String name;
                  public boolean enabled;
                  public final int key;
                  public Module(String n, int k) { name = n; key = k; }
                  public void toggle() { enabled = !enabled; }
                  public abstract void onTick(MinecraftClient mc);
              }

              public static class MainGui extends Screen {
                  private int dragX = -1, dragY = -1, panelX = 60, panelY = 60;
                  private final int W = 240;
                  public MainGui() { super(Text.literal("Zefavi")); }

                  @Override public void render(DrawContext ctx, int mx, int my, float d) {
                      ctx.fill(0, 0, width, height, 0x66000000);
                      ctx.fill(panelX - 3, panelY - 3, panelX + W + 3,
                               panelY + 26 + modules.size() * 24 + 6, 0xAA101010);
                      ctx.fill(panelX, panelY, panelX + W,
                               panelY + 26 + modules.size() * 24, 0xFF0A0A14);
                      for (int i = 0; i < 26; i++) {
                          int alpha = 0xFF - (i * 4);
                          int c = (alpha << 24) | (0x9A << 16) | (0x3C << 8) | 0xFF;
                          ctx.fill(panelX, panelY + i, panelX + W, panelY + i + 1, c);
                      }
                      ctx.drawText(textRenderer, "ZEFAVI", panelX + 12, panelY + 9, 0xFFFFFFFF, true);
                      int y = panelY + 30;
                      for (Module m : modules) {
                          int bg = m.enabled ? 0xFF1F0033 : 0xFF12121E;
                          ctx.fill(panelX + 6, y, panelX + W - 6, y + 20, bg);
                          ctx.drawText(textRenderer, m.name, panelX + 14, y + 6,
                                       m.enabled ? 0xFFB57BFF : 0xFF808080, true);
                          int dot = m.enabled ? 0xFFB57BFF : 0xFF303030;
                          ctx.fill(panelX + W - 22, y + 7, panelX + W - 14, y + 15, dot);
                          y += 24;
                      }
                      super.render(ctx, mx, my, d);
                  }

                  @Override public boolean mouseClicked(double mx, double my, int b) {
                      if (b == 0) {
                          if (mx >= panelX && mx <= panelX + W && my >= panelY && my <= panelY + 26) {
                              dragX = (int) mx - panelX; dragY = (int) my - panelY; return true;
                          }
                          int y = panelY + 30;
                          for (Module m : modules) {
                              if (mx >= panelX + 6 && mx <= panelX + W - 6 && my >= y && my <= y + 20) {
                                  m.toggle(); return true;
                              }
                              y += 24;
                          }
                      }
                      return super.mouseClicked(mx, my, b);
                  }
                  @Override public boolean mouseDragged(double mx, double my, int b, double dx, double dy) {
                      if (dragX >= 0) { panelX = (int) mx - dragX; panelY = (int) my - dragY; return true; }
                      return super.mouseDragged(mx, my, b, dx, dy);
                  }
                  @Override public boolean mouseReleased(double mx, double my, int b) {
                      dragX = -1; dragY = -1; return super.mouseReleased(mx, my, b);
                  }
                  @Override public boolean shouldPause() { return false; }
              }
          }
          EOF

          sed -i 's/^          //' build.gradle settings.gradle src/main/resources/fabric.mod.json src/main/java/com/zefavi/client/ZefaviClient.java

      - name: Gradle wrapper
        run: gradle wrapper --gradle-version 8.11

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: zefavi-client-jar
          path: build/libs/*.jar
